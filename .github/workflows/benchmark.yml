name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '9.15.0'
  BENCH_MODE: ${{ inputs.mode || 'smoke' }}

jobs:
  benchmark:
    name: Run benchmarks (${{ inputs.mode || 'smoke' }})
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Smoke mode (push, PR, and manual smoke) ────────────────────────────
      - name: Smoke — SPA track
        if: env.BENCH_MODE != 'full'
        run: pnpm bench:smoke:spa

      - name: Smoke — Next.js track
        if: env.BENCH_MODE != 'full'
        run: pnpm bench:smoke:next

      # ── Full mode (manual full trigger only) ──────────────────────────────
      - name: Full — SPA dev benchmarks
        if: env.BENCH_MODE == 'full'
        run: pnpm bench:dev:spa

      - name: Full — SPA build benchmarks
        if: env.BENCH_MODE == 'full'
        run: pnpm bench:build:spa

      - name: Full — Next.js dev benchmarks
        if: env.BENCH_MODE == 'full'
        run: pnpm bench:dev:next

      - name: Full — Next.js build benchmarks
        if: env.BENCH_MODE == 'full'
        run: pnpm bench:build:next


      - name: Upload raw results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}-${{ env.BENCH_MODE }}
          path: results/
          retention-days: 90
